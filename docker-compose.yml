        NEXT_PUBLIC_REWARDS_BASE_URL: https://rewards.ptg.co.th
        NEXT_PUBLIC_BASE_PATH: /Customer-console
        NEXT_PUBLIC_PDF_API_URL: http://host.docker.internal:3400
    ports:
      - "3302:3302"
    environment:
      - TZ=Asia/Bangkok
      - NODE_ENV=production
      - APP_ENV=production
      # Auth API - Production
      - AUTH_API_BASE_URL=https://www.ptg.co.th
